name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install headless Chrome
        run: |
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/puppeteer"
          sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgbm1 libasound2t64 || true
      - run: npm test
        env:
          READPACE_REQUIRE_CHROME: "1"
      - name: Example — hand-timed composition must fail with exit code 1
        run: |
          set +e
          node bin/readpace.js check examples/spf-dmarc
          code=$?
          test "$code" -eq 1 || { echo "expected exit 1 (slides too short), got $code"; exit 1; }
